<!DOCTYPE html>
<html> 
  <head>
    <title>Todo App</title>
    <link 
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700" 
      rel="stylesheet"
    >
    <link 
      rel="stylesheet" 
      href="style.css" 
      media="screen" 
      charset="utf-8"
    >
  </head>
  <body class="page">
    <header class="page-header">
      <img class="header-img" src="./eisenhower-matrix.jpg" alt="photo">
      <a 
        class="header-inf" 
        href="https://goal-life.com/page/method/matrix-eisenhower"
      >
        Want more details&quest;
      </a>
    </header>
    <main class="page-main">
      <section 
       class="main-add-elements" >
        <label class="task-input__title-new-task" for="new-task">Add Item</label>
        <div class="task-row-wrapper">
          <input 
            id="new-task" 
            class="task-add task" 
            type="text"
          >
          <button class="add-btn" id="addBtn">Add</button>
        </div>
      </section>
    <section class="main-edit__wrapper">
      <h3 class="main-edit__title">Todo</h3>
      <ul class="edit-task-items__wrapper" id="incompleteTasks">
        <li class="task-item">
          <input class="task-input__checkbox" type="checkbox">
          <label class="task-input__title task">Pay Bills</label>
          <input class="task-input__edit task" type="text">
          <button class="task-btn__edit edit">Edit</button>
          <button  class="task-btn__delete delete">
            <img class="delete-img" src="./remove.svg" alt="photo">
          </button>
        </li>
        <li class="task-item editMode">
          <input class="task-input__checkbox" type="checkbox">
          <label class="task-input__title task">Go Shopping</label>
          <input class="task-input__edit task" type="text" value="Go Shopping">
          <button class="task-btn__edit edit">Save</button>
          <button class="task-btn__delete delete">
            <img class="delete-img" src="./remove.svg" alt="photo">
          </button>
        </li>
      </ul>
    </section>
    <section class="main-complete__wrapper">
      <h3 class="main-complete__title" >Completed</h3>
      <ul class="complete-task-items__wrapper" id="completed-tasks">
        <li class="task-item" >
          <input class="task-input__checkbox" type="checkbox" checked>
          <label class="task-input__title complite--title task">See the Doctor</label>
          <input class="task-input__edit task" type="text">
          <button class="task-btn__edit edit">Edit</button>
          <button class="task-btn__delete delete">
            <img class="delete-img" src="./remove.svg" alt="photo">
          </button>
        </li>
      </ul>
    </section>
    </main>
    <script 
      type="text/javascript" 
      src="app.js"
    ></script>
  </body>
</html>
